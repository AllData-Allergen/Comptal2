  /label-rules/apply:
    post:
      summary: Applique les regles de libelles actives aux transactions sans categorie (mot le plus long prioritaire, audit)
      description: >
        Cible les transactions actives (non supprimees) sans categorie, filtreees
        par ids (liste d'entiers) ou import_id. dry_run=true renvoie l'apercu
        des changements sans rien ecrire.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  description: Cible explicite de transactions (sinon toutes les actives sans categorie)
                import_id:
                  type: integer
                  description: Cible les transactions d'un import
                dry_run: { type: boolean }
      responses:
        "200":
          description: >
            {applied, changes} si application effective ;
            {dry_run, changes, count} si apercu
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: integer }
                  dry_run: { type: boolean }
                  count: { type: integer }
                  changes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        before:
                          type: object
                          properties:
                            categoryCode: { type: string, nullable: true }
                        after:
                          type: object
                          properties:
                            categoryCode: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

