  /factures/{id}/paiements/auto-link:
    post:
      summary: Lie automatiquement les transactions dont le libelle contient le numero de facture (aligne autoLinkLabelMatches, dry_run supporte, audit)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean }
      responses:
        "200":
          description: Nombre de paiements lies (0 si aucun)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  facture:
                    $ref: "#/components/schemas/FactureDocument"
                  linked: { type: integer }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /factures/{id}/paiements:
    post:
      summary: Enregistre un paiement manuel (especes/cheque) et cree la transaction de tresorerie correspondante (aligne addManualPaiement, dry_run supporte, audit)
      description: >-
        L'app choisit le compte de tresorerie via EmetteurService ; l'agent-api
        n'a pas d'emetteur, donc l'agent fournit account_id explicitement.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [montant, date, mode, account_id]
              properties:
                montant: { type: number, minimum: 0.01 }
                date: { type: string, format: date }
                mode: { type: string, enum: [especes, cheque] }
                account_id: { type: integer, minimum: 1 }
                reference: { type: string }
                dry_run: { type: boolean }
      responses:
        "201":
          description: Paiement enregistre + transaction de tresorerie creee
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  facture:
                    $ref: "#/components/schemas/FactureDocument"
                  paiement_id: { type: string }
        "200":
          description: dry_run (diff prevu, aucune ecriture)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /factures/{id}/paiements/{paiementId}:
