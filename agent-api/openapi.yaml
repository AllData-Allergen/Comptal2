      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: paiementId
          in: path
          required: true
          schema: { type: string }
        - name: confirm
          in: query
          required: true
          schema: { type: boolean }
          description: Confirmation obligatoire pour ce retrait
      responses:
        "200":
          description: Paiement retire, statut recalcule (ou diff prevu si dry_run)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
